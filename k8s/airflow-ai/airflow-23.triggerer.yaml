# Triggerer. Runs the asyncio event loop that services deferrable operators, so a sensor
# waiting on an external condition does not hold a worker slot.
#
# Neither DAG in this repository currently defers, so this component is idle today. It is
# included because deferrable operators are the standard way to write long-polling Sonador
# tasks, and adding the triggerer after the fact means tasks mysteriously hanging in a
# "deferred" state with nothing to service them.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-triggerer
  namespace: airflow-ai
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: triggerer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
      app.kubernetes.io/component: triggerer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/component: triggerer
    spec:
      securityContext:
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: triggerer
        image: oaktreetech/sonador-airflow.ai
        args: ["triggerer"]
        envFrom:
        - configMapRef:
            name: airflow-config
        - secretRef:
            name: airflow-secrets
        volumeMounts:
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/sonador_sso.py
          subPath: sonador_sso.py
          readOnly: true
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/sonador_auth.py
          subPath: sonador_auth.py
          readOnly: true
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/sonador_hook.py
          subPath: sonador_hook.py
          readOnly: true
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/object_storage_hook.py
          subPath: object_storage_hook.py
          readOnly: true
        - name: dags-io
          mountPath: /opt/airflow/dags/sonador
          readOnly: true
        - name: dags-ai
          mountPath: /opt/airflow/dags/ai
          readOnly: true
        - name: logs
          mountPath: /opt/airflow/logs
        # `airflow jobs check` takes 5-8s here: every Airflow CLI call imports sonador_auth,
        # which makes an HTTPS round trip to Sonador before doing anything. An exec probe
        # defaults to timeoutSeconds: 1, which this can never satisfy -- the container would
        # sit at 0/1 Running with nothing in its log.
        #
        # --local matches jobs whose hostname equals hostname_callable, which is pinned to
        # socket.gethostname in airflow-config. Passing --hostname "$(hostname)" instead is
        # fragile: Airflow defaults hostname_callable to getfqdn, and for pods governed by a
        # headless service getfqdn returns the full <pod>.<svc>.<ns>.svc.cluster.local name.
        startupProbe:
          exec:
            command: ["bash", "-c", "airflow jobs check --job-type TriggererJob --local"]
          periodSeconds: 20
          timeoutSeconds: 20
          failureThreshold: 30
        livenessProbe:
          exec:
            command: ["bash", "-c", "airflow jobs check --job-type TriggererJob --local"]
          periodSeconds: 120
          timeoutSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            memory: "2Gi"
      volumes:
      - name: modules
        configMap:
          name: airflow-modules
          defaultMode: 0444
      - name: dags-io
        configMap:
          name: airflow-dags-io
          defaultMode: 0444
      - name: dags-ai
        configMap:
          name: airflow-dags-ai
          defaultMode: 0444
      - name: logs
        emptyDir: {}
