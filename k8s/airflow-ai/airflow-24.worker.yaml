# Celery workers -- the processes that actually execute tasks.
#
# A StatefulSet rather than a Deployment, so each worker gets its own PersistentVolumeClaim
# for the TotalSegmentator model cache. TotalSegmentator downloads several GB of weights on
# first use and caches them under ~/.totalsegmentator; without a volume every pod restart
# re-downloads them. A single shared ReadWriteOnce claim cannot be mounted by two pods on
# different nodes, and RWX storage is not assumed here -- volumeClaimTemplates sidesteps both
# problems at the cost of one weights copy per worker.
#
# Scaling: raise `replicas`. Each new worker provisions its own 20Gi cache volume, and those
# volumes are NOT deleted when you scale back down.
#
# This manifest is CPU-only. To schedule on GPU nodes, uncomment the nvidia.com/gpu limit and
# the nodeSelector below; both require the NVIDIA device plugin on the cluster (see
# docs/nvida-runtime.md). On CPU, TotalSegmentator inference is very slow but correct.
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-worker
  namespace: airflow-ai
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: worker
  ports:
  # Airflow's per-worker log server. Remote logging to S3 is enabled, so the API server does
  # not normally need this, but it is the fallback path while a task is still running.
  - name: worker-logs
    port: 8793
    targetPort: worker-logs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-worker
  namespace: airflow-ai
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: worker
spec:
  serviceName: airflow-worker
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
      # Celery warm shutdown: let a running task finish rather than killing it mid-inference.
      # Raise this if segmentation tasks routinely run longer than 10 minutes.
      terminationGracePeriodSeconds: 600
      containers:
      - name: worker
        image: oaktreetech/sonador-airflow.ai
        args: ["celery", "worker"]
        ports:
        - name: worker-logs
          containerPort: 8793
        envFrom:
        - configMapRef:
            name: airflow-config
        - secretRef:
            name: airflow-secrets
        env:
        # Celery reports itself as celery@<hostname>; the StatefulSet gives a stable one.
        - name: AIRFLOW__CELERY__WORKER_CONCURRENCY
          value: "4"
        volumeMounts:
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/sonador_sso.py
          subPath: sonador_sso.py
          readOnly: true
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/sonador_auth.py
          subPath: sonador_auth.py
          readOnly: true
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/sonador_hook.py
          subPath: sonador_hook.py
          readOnly: true
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/object_storage_hook.py
          subPath: object_storage_hook.py
          readOnly: true
        # The TotalSegmentator DAG shells out to this exact path. The image's Dockerfile
        # copies it to a relative destination, so it actually lands at
        # /opt/airflow/home/airflow/env/totalsegmentator/ and the DAG's BashOperator would
        # fail with "No such file or directory". Compose papers over the same bug with a
        # bind mount; this is the Kubernetes equivalent.
        - name: modules
          mountPath: /home/airflow/env/totalsegmentator/bin/airflow-totalsegmentator.execute.py
          subPath: airflow-totalsegmentator.execute.py
          readOnly: true
        - name: dags-io
          mountPath: /opt/airflow/dags/sonador
          readOnly: true
        - name: dags-ai
          mountPath: /opt/airflow/dags/ai
          readOnly: true
        - name: logs
          mountPath: /opt/airflow/logs
        - name: totalsegmentator
          mountPath: /home/airflow/.totalsegmentator
        # Asks the worker to answer over the broker, which exercises Celery end to end rather
        # than just checking the process is alive. Note the module path: compose still uses
        # airflow.executors.celery_executor, which no longer exists in Airflow 3.
        #
        # This is the slowest probe in the deployment -- measured at 13-15s, because it pays
        # for the Airflow CLI import (including sonador_auth's HTTPS call to Sonador) and then
        # a broker round trip. An exec probe defaults to timeoutSeconds: 1, so without these
        # values the worker never reports Ready and sits at 0/1 with an empty log.
        #
        # celery@$(hostname) resolves correctly because hostname_callable is pinned to
        # socket.gethostname in airflow-config. Left at the Airflow default of getfqdn, this
        # StatefulSet's pods would register as celery@<pod>.<svc>.<ns>.svc.cluster.local and
        # the -d target would never match.
        startupProbe:
          exec:
            command:
            - bash
            - -c
            - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$(hostname)"'
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 20
        livenessProbe:
          exec:
            command:
            - bash
            - -c
            - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$(hostname)"'
          periodSeconds: 120
          timeoutSeconds: 45
          failureThreshold: 5
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            memory: "8Gi"
            # nvidia.com/gpu: 1
      # nodeSelector:
      #   nvidia.com/gpu.present: "true"
      volumes:
      - name: modules
        configMap:
          name: airflow-modules
          defaultMode: 0444
      - name: dags-io
        configMap:
          name: airflow-dags-io
          defaultMode: 0444
      - name: dags-ai
        configMap:
          name: airflow-dags-ai
          defaultMode: 0444
      - name: logs
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: totalsegmentator
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
      # storageClassName: local-path
