# Flower -- Celery's monitoring UI. Shows worker registration, task throughput, and the
# queue backlog; the fastest way to tell "the scheduler is not dispatching" apart from "the
# workers are not consuming".
#
# Deliberately not exposed through the ingress: Flower has no authentication in this
# configuration and would publish task arguments, which for these DAGs include Sonador
# series identifiers. Reach it with a port-forward:
#
#   kubectl -n airflow-ai port-forward svc/airflow-flower 5555:5555
#
# If it does need to be public, put it behind a separate host with a Traefik basic-auth
# middleware, or drop this manifest entirely -- nothing else depends on it.
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-flower
  namespace: airflow-ai
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: flower
spec:
  selector:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: flower
  ports:
  - name: flower
    port: 5555
    targetPort: flower
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-flower
  namespace: airflow-ai
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
      app.kubernetes.io/component: flower
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/component: flower
    spec:
      securityContext:
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: flower
        image: oaktreetech/sonador-airflow.ai
        args: ["celery", "flower"]
        ports:
        - name: flower
          containerPort: 5555
        envFrom:
        - configMapRef:
            name: airflow-config
        - secretRef:
            name: airflow-secrets
        volumeMounts:
        # Flower parses no DAGs, but the auth manager still imports at startup, so
        # sonador_auth and its siblings have to be present.
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/sonador_sso.py
          subPath: sonador_sso.py
          readOnly: true
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/sonador_auth.py
          subPath: sonador_auth.py
          readOnly: true
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/sonador_hook.py
          subPath: sonador_hook.py
          readOnly: true
        - name: modules
          mountPath: /home/airflow/.local/lib/python3.10/site-packages/object_storage_hook.py
          subPath: object_storage_hook.py
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: flower
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: flower
          periodSeconds: 60
          failureThreshold: 5
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            memory: "1Gi"
      volumes:
      - name: modules
        configMap:
          name: airflow-modules
          defaultMode: 0444
