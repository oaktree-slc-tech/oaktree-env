# Sensitive configuration for the Sonador Airflow deployment.
#
# SAMPLE / REFERENCE. Every value here is a placeholder taken from the development
# environment in compose/ -- they are published defaults, not credentials. Replace all of
# them before deploying anywhere real.
#
# Keep real values out of this repository. Either apply this file from a working copy
# outside the tree, or copy it to airflow-secrets.local.yaml (gitignored) and edit that:
#
#   cp airflow-secrets.yaml airflow-secrets.local.yaml
#   $EDITOR airflow-secrets.local.yaml
#   kubectl apply -f airflow-secrets.local.yaml
#
# Every key is named exactly as the environment variable it becomes, so each component pulls
# the whole set with a single `envFrom: secretRef`. Do not rename a key without updating the
# component that reads it.
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: airflow-ai
  labels:
    app.kubernetes.io/name: airflow
type: Opaque
stringData:

  # --- Metadata database -----------------------------------------------------------------
  #
  # A production cluster will point these at an external PostgreSQL. The service name below
  # is the read/write endpoint of a CloudNativePG cluster; compose uses a plain container.
  #
  #   compose:  postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
  #             db+postgresql://airflow:airflow@airflow-postgres/airflow
  #
  # IMPORTANT: percent-encode reserved characters in the password. A literal "@" is not
  # rejected by SQLAlchemy -- it silently parses as part of the host, leaving a truncated
  # password and a hostname that fails DNS. "p@ss" must be written "p%40ss".
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:REPLACE-DB-PASSWORD@airflow-postgres-rw:5432/airflow"

  # Celery result backend -- same database, "db+" prefix instead of a SQLAlchemy driver.
  AIRFLOW__CELERY__RESULT_BACKEND: "db+postgresql://airflow:REPLACE-DB-PASSWORD@airflow-postgres-rw:5432/airflow"

  # --- Celery broker (RabbitMQ) ----------------------------------------------------------
  #
  # Must match RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS below. The trailing "/" selects
  # the default vhost.
  #
  #   compose:  amqp://guest:guest@message-broker:5672
  #
  # The compose broker uses the built-in guest account. Do not carry that into a cluster:
  # the stock RabbitMQ image ships loopback_users.guest = false, so guest is reachable from
  # any pod in the cluster.
  AIRFLOW__CELERY__BROKER_URL: "amqp://airflow:REPLACE-BROKER-PASSWORD@airflow-rabbitmq:5672//"

  # --- Sonador ---------------------------------------------------------------------------
  #
  # API token for the data service named by SONADOR_SERVICE_CLIENT_ID in airflow-config.yaml.
  # Every component imports sonador_auth at startup, which calls Sonador before doing any
  # work, so a bad token is a deployment-wide crash loop rather than just failed SSO.
  #
  #   compose:  secure-api@sonador-dev
  SONADOR_APITOKEN: "secure-api@sonador-dev"

  # Airflow Connection consumed by the TotalSegmentator DAG as `conn[params.conn_id]`.
  # Supplied as an env-var connection so it resolves during DAG parsing, where Airflow 3
  # forbids database access. The DAG reads schema/host/port/password plus the two extras.
  #
  #   compose:  SONADOR_URL="http://imaging:8070"  ->  schema http, host imaging, port 8070
  AIRFLOW_CONN_SONADOR: >-
    {"conn_type": "generic",
     "host": "imaging.example.com",
     "schema": "https",
     "port": 443,
     "password": "secure-api@sonador-dev",
     "extra": {"SONADOR_INTERNAL_DNS": false, "SONADOR_IMAGING_SERVER": ""}}

  # --- Object storage --------------------------------------------------------------------
  #
  # Backs two things: remote task logging (s3://airflow-logs, see airflow-config.yaml) and
  # the intermediate segmentation arrays written by the AI DAG. Any S3-compatible endpoint
  # works; the development environment uses MinIO.
  #
  # Values below are the worked example from docs/env-prod.airflow-remote-logging.md:
  #   aws_access_key_id "jupyter" / aws_secret_access_key "jupyter@analytics"
  #   endpoint "http://object-storage:9000"
  #
  # That document creates this connection through the Airflow UI. Supplying it as an env-var
  # connection instead keeps the deployment reproducible and makes it available at DAG parse
  # time. Note the key is `endpoint_url`, not the `host` the older UI recipe shows.
  # The target bucket must already exist -- object storage will not create it on demand.
  AIRFLOW_CONN_S3_DEFAULT: >-
    {"conn_type": "aws",
     "extra": {"aws_access_key_id": "jupyter",
               "aws_secret_access_key": "jupyter@analytics",
               "endpoint_url": "http://object-storage:9000",
               "region_name": "us-east-1",
               "OBJECTS_BUCKET": "airflow"}}

  # --- Airflow instance secrets ----------------------------------------------------------
  #
  # Must be byte-identical across every component. The JWT secret is what lets workers and
  # the scheduler authenticate to the execution API.
  #
  # These are the published development values from compose/airflow-ai.yaml. Generate real
  # ones before the first run -- rotating the Fernet key later invalidates every connection
  # and variable password already encrypted in the metadata database:
  #
  #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  #   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
  AIRFLOW__CORE__FERNET_KEY: "ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg="
  AIRFLOW__API__SECRET_KEY: "sonador.airflow-api-secret"
  AIRFLOW__API_AUTH__JWT_SECRET: "sonador.airflow-api-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-rabbitmq-secrets
  namespace: airflow-ai
  labels:
    app.kubernetes.io/name: rabbitmq
type: Opaque
stringData:

  # Consumed by the rabbitmq image on first boot. Setting RABBITMQ_DEFAULT_USER replaces the
  # built-in guest account rather than adding to it -- after boot, `rabbitmqctl list_users`
  # shows only this user.
  #
  #   compose:  no credentials set, so the image keeps guest/guest
  #
  # These take effect ONLY on first boot, while the mnesia database is empty. That database
  # lives on the PVC, so editing this Secret later changes nothing; rotate with
  # `rabbitmqctl change_password` inside the pod, or delete the PVC.
  RABBITMQ_DEFAULT_USER: "airflow"
  RABBITMQ_DEFAULT_PASS: "REPLACE-BROKER-PASSWORD"

  # Pinned so the node keeps its identity across restarts, and so a second node could join.
  # Any stable random string.
  RABBITMQ_ERLANG_COOKIE: "REPLACE-ERLANG-COOKIE"
