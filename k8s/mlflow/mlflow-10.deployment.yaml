# MLflow tracking server with Sonador Data Service authentication.
#
# The oaktreetech/mlflow image ships the sonador-mlflow-auth plugin (see docker/mlflow in
# the environment repository); `--app-name sonador-auth` enables Sonador SSO for the UI and
# API token validation for the REST API. All credentials and connection parameters come
# from the mlflow-secrets secret (envFrom below).
#
# $(MLFLOW_BACKEND_STORE_URI) in the args is Kubernetes env-var expansion -- it keeps the
# database DSN out of the pod spec. The artifact bucket is not sensitive and is set inline.
#
# The server is stateless: runs/metrics live in PostgreSQL (CNPG), artifacts in object
# storage, and SSO sessions in signed cookies. Replicas can be raised as long as
# MLFLOW_FLASK_SERVER_SECRET_KEY is shared (it is, via the secret).
#
# Startup runs Alembic migrations against the backend store, which can take a minute on
# first boot -- hence the generous startupProbe.
#
# In-cluster route to Sonador: when MLflow runs in the same cluster as Sonador, the public
# Sonador hostname may not be reachable from inside (and kube-dns cannot rewrite external
# names the way CoreDNS can). The hostAliases entry below points the public hostname at the
# ingress-nginx controller's ClusterIP: requests keep the public hostname for SNI/Host, the
# ingress serves the real certificate, TLS terminates at the controller, and certificate
# validation passes (SONADOR_VERIFY_SSL=true in mlflow-secrets). Because the URL is then
# identical inside and outside the cluster, the browser-facing OIDC redirect flow needs no
# split configuration (SONADOR_PUBLIC_URL stays unset).
#
# Copy this file to mlflow-10.deployment.local.yaml (gitignored), set the real hostname and
# controller ClusterIP, and apply that. Find the IP with:
#
#   kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath='{.spec.clusterIP}'
#
# NOTE: use the controller data-path service, NOT ingress-nginx-controller-admission -- the
# admission service fronts the validating webhook, not proxied traffic. The ClusterIP is
# stable for the life of the Service; re-check it if the ingress controller is reinstalled.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: sonador-ai
  labels:
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
    spec:
      # Route the public Sonador hostname to the ingress controller (see header comment)
      hostAliases:
      - ip: "REPLACE-INGRESS-CONTROLLER-CLUSTER-IP"
        hostnames:
        - "imaging.example.com"
      containers:
      - name: mlflow
        image: oaktreetech/mlflow:2026-08
        imagePullPolicy: IfNotPresent
        command: ["mlflow", "server"]
        args:
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "5000"
        - "--app-name"
        - "sonador-auth"
        # Default is 4 uvicorn workers; each fully imports the MLflow+genai stack
        # (~500MB RSS), which overruns the memory limit. Two is plenty here.
        - "--workers"
        - "2"
        - "--backend-store-uri"
        - "$(MLFLOW_BACKEND_STORE_URI)"
        - "--default-artifact-root"
        - "s3://mlflow-experiments"
        envFrom:
        - secretRef:
            name: mlflow-secrets
        ports:
        - name: http
          containerPort: 5000
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: sonador-ai
  labels:
    app.kubernetes.io/name: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
  - name: http
    port: 5000
    targetPort: http
