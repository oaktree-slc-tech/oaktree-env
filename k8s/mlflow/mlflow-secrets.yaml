# Sensitive configuration for the Sonador MLflow deployment.
#
# SAMPLE / REFERENCE. Every value here is a placeholder. Replace all of them before
# deploying anywhere real.
#
# Keep real values out of this repository. Either apply this file from a working copy
# outside the tree, or copy it to mlflow-secrets.local.yaml (gitignored) and edit that:
#
#   cp mlflow-secrets.yaml mlflow-secrets.local.yaml
#   $EDITOR mlflow-secrets.local.yaml
#   kubectl apply -f mlflow-secrets.local.yaml
#
# Every key is named exactly as the environment variable it becomes; the deployment pulls
# the whole set with a single `envFrom: secretRef`. Do not rename a key without updating
# the deployment that reads it.
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secrets
  namespace: sonador-ai
  labels:
    app.kubernetes.io/name: mlflow
type: Opaque
stringData:

  # --- Backend store (CNPG PostgreSQL) --------------------------------------------------
  #
  # Host is the CNPG read/write service from mlflow-05.database.yaml. The password must
  # match the mlflow-postgres-superuser secret.
  #
  # IMPORTANT: percent-encode reserved characters in the password. A literal "@" is not
  # rejected by SQLAlchemy -- it silently parses as part of the host, leaving a truncated
  # password and a hostname that fails DNS. "p@ss" must be written "p%40ss".
  MLFLOW_BACKEND_STORE_URI: "postgresql://postgres:REPLACE-DB-PASSWORD@mlflow-postgres-rw:5432/mlflow"

  # --- Artifact store (S3-compatible object storage) ------------------------------------
  #
  # For Google Cloud Storage, use the S3 interoperability endpoint with an HMAC key pair
  # (GCS console: Settings -> Interoperability). The artifact bucket itself is set on the
  # server command line in mlflow-10.deployment.yaml.
  MLFLOW_S3_ENDPOINT_URL: "https://storage.googleapis.com"
  AWS_ACCESS_KEY_ID: "REPLACE-HMAC-ACCESS-ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE-HMAC-SECRET"
  AWS_DEFAULT_REGION: "auto"

  # --- Sonador Connection / SSO ---------------------------------------------------------
  #
  # Refer to README.md in docker/mlflow for details on creating and configuring the data
  # service. SONADOR_SERVICE_REDIRECT_URL is pinned explicitly because TLS terminates at
  # the ingress: the app would otherwise derive an http:// redirect from the proxied
  # request. The value must be registered verbatim in the data service "Callback URL" list.
  #
  # SONADOR_URL uses the PUBLIC hostname even for in-cluster API calls: the deployment's
  # hostAliases entry routes it to the ingress-nginx controller, which serves the real
  # certificate -- so SONADOR_VERIFY_SSL can stay on and the OIDC redirect flow needs no
  # internal/external URL split (SONADOR_PUBLIC_URL stays unset).
  SONADOR_URL: "https://imaging.example.com"
  SONADOR_VERIFY_SSL: "true"
  SONADOR_APITOKEN: "REPLACE-SONADOR-API-TOKEN"
  SONADOR_SERVICE_CLIENT_ID: "REPLACE-DATA-SERVICE-ID"
  SONADOR_SERVICE_REDIRECT_URL: "https://mlflow.example.com/oauth-authorized/sonador"

  # --- MLflow server --------------------------------------------------------------------
  #
  # The Flask secret signs the SSO session cookie. It must be identical on every replica
  # (it is, via this secret) and unique per deployment: `python3 -c "import secrets;
  # print(secrets.token_urlsafe(48))"`. ALLOWED_HOSTS must list the public hostname.
  MLFLOW_FLASK_SERVER_SECRET_KEY: "REPLACE-SESSION-SECRET"
  MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow.example.com"
  MLFLOW_CRYPTO_KEK_PASSPHRASE: "REPLACE-KEK-PASSPHRASE"
